<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ED·ET viewport lab</title>
<style>
  /* Dev page: the panel in the 6 viewport classes at once (docs/design/RESPONSIVE-FLIGHT.md).
     Each frame has the real CSS size of that screen, scaled down to fit. */
  :root { color-scheme: dark; }
  body { margin: 0; padding: 12px; background: #050302; color: #b49b80; font: 12px/1.4 Consolas, ui-monospace, monospace; }
  h1 { margin: 0 0 10px; color: #ffb545; font-size: 14px; letter-spacing: .12em; }
  h1 small { color: #6d4826; font-weight: 400; letter-spacing: 0; }
  .grid { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { display: flex; gap: 8px; margin-bottom: 4px; }
  figcaption b { color: #ff7a18; }
  figcaption a { color: #37c6d4; }
  .box { position: relative; overflow: hidden; outline: 1px solid #3d2404; }
  iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #0b0705; }
</style>
</head>
<body>
<h1>VIEWPORT LAB <small>· live panel in each layout class · CSS px as measured on the devices</small></h1>
<div class="grid" id="grid"></div>
<script>
  // [class, example device, width, height, scale]
  const FRAMES = [
    ['desktop-landscape', 'monitor 1080p', 1920, 950, 0.36],
    ['desktop-portrait', 'monitor 1080p rotated', 1080, 1800, 0.19],
    // measured on the user's devices, opened from the home screen (full screen)
    ['tablet-landscape', 'iPad Air 3 · home screen', 1112, 843, 0.42],
    ['tablet-portrait', 'iPad Air 3 · home screen', 834, 1112, 0.32],
    ['phone-landscape', 'iPhone 13 · home screen', 844, 390, 0.55],
    ['phone-portrait', 'iPhone 13 · home screen', 390, 844, 0.42],
  ];
  const only = new URLSearchParams(location.search).get('only');
  const grid = document.getElementById('grid');
  for (const [vp, device, w, h, scale] of FRAMES) {
    if (only && only !== vp) continue;
    const k = only ? Math.min(1, (innerWidth - 30) / w, (innerHeight - 70) / h) : scale;
    const fig = document.createElement('figure');
    fig.innerHTML = `<figcaption><b>${vp}</b><span>${device} · ${w}×${h}</span>
      <a href="?only=${vp}">zoom</a><a href="/" target="_blank">open</a></figcaption>
      <div class="box" style="width:${Math.round(w * k)}px;height:${Math.round(h * k)}px">
        <iframe src="/" width="${w}" height="${h}" style="transform:scale(${k})" title="${vp}"></iframe>
      </div>`;
    grid.append(fig);
  }
</script>
</body>
</html>
